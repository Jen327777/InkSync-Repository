<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Staff Account - InkSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <div id="pageError" class="alert alert-danger d-none m-3" role="alert"></div>

  <main id="app" class="container py-4 invisible">
    <div class="staff-page mx-auto">
      <a href="dashboard.html#users" class="text-decoration-none small">&larr; Back to User Management</a>

      <div class="card mt-3 staff-card">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Create Staff Account</h1>
          <p class="text-muted">The new account will have Staff access.</p>

          <div id="staffFormError" class="alert alert-danger d-none" role="alert"></div>

          <form id="staffForm" novalidate>
            <div class="mb-3">
              <label for="fullName" class="form-label fw-semibold">Full name</label>
              <input type="text" id="fullName" name="full_name" class="form-control" maxlength="120" autocomplete="off">
              <div class="invalid-feedback" data-error-for="full_name"></div>
            </div>

            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Username</label>
              <input type="text" id="username" name="username" class="form-control" maxlength="50" autocomplete="off">
              <div class="form-text">3 to 50 letters, numbers or underscores.</div>
              <div class="invalid-feedback" data-error-for="username"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <input type="password" id="password" name="password" class="form-control" autocomplete="new-password">
                <button type="button" id="togglePassword" class="btn btn-outline-secondary" aria-label="Show passwords" aria-controls="password confirmPassword">Show</button>
              </div>
              <div class="form-text">8 to 72 characters.</div>
              <div class="invalid-feedback" data-error-for="password"></div>
            </div>

            <div class="mb-3">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm password</label>
              <input type="password" id="confirmPassword" name="confirm_password" class="form-control" autocomplete="new-password">
              <div class="invalid-feedback" data-error-for="confirm_password"></div>
            </div>

            <div class="mb-4">
              <label for="accountStatus" class="form-label fw-semibold">Account status</label>
              <select id="accountStatus" name="account_status" class="form-select">
                <option value="active" selected>Active</option>
                <option value="inactive">Inactive</option>
              </select>
              <div class="invalid-feedback" data-error-for="account_status"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <a href="dashboard.html#users" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" id="staffSaveBtn" class="btn btn-primary">Create Account</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/create-staff.js"></script>
</body>
</html>
