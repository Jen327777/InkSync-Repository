<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - InkSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body class="login-body">
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card login-card w-100">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-mark mx-auto mb-3" aria-hidden="true">IS</div>
          <h1 class="h3 fw-bold mb-1">WELCOME BACK!</h1>
          <p class="text-muted mb-0">Sign in to continue to InkSync</p>
        </div>

        <div id="loginNotice" class="alert alert-warning d-none" role="status"></div>
        <div class="d-flex gap-2 mb-4" role="group" aria-label="Choose access type">
          <button type="button" id="adminBtn" class="btn btn-outline-primary flex-fill role-btn" aria-pressed="false">Admin</button>
          <button type="button" id="staffBtn" class="btn btn-outline-primary flex-fill role-btn" aria-pressed="false">Staff</button>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" id="username" class="form-control form-control-lg" autocomplete="username" aria-describedby="loginError" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <input type="password" id="password" class="form-control form-control-lg" autocomplete="current-password" aria-describedby="loginError" required>
              <button type="button" id="togglePassword" class="btn btn-outline-secondary" aria-label="Show password" aria-controls="password">Show</button>
            </div>
          </div>

          <div id="loginError" class="text-danger small mb-3" role="alert" aria-live="polite"></div>

          <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
        </form>        
      </div>
    </div>
  </main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
