<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InkSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>
  <header class="navbar bg-white border-bottom sticky-top px-3">
    <button class="btn d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open navigation">&#9776;</button>
    <a class="navbar-brand fw-bold text-primary" href="#">InkSync</a>
    <span class="ms-auto text-muted small">Order Tracking Board</span>
  </header>

  <div class="container-fluid">
    <div class="row">
      <nav id="sidebar" class="offcanvas-md offcanvas-start col-md-3 col-lg-2 bg-dark text-white p-0" tabindex="-1" aria-label="Main navigation">
        <div class="offcanvas-header">
          <span class="fw-bold">InkSync</span>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close navigation"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
  <ul class="nav flex-column w-100">
    <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link text-white" href="#">Order Logs</a></li>
  </ul>
  <div class="mt-auto pt-3 border-top border-secondary w-100">
    <div class="small mb-2">Signed in as <span id="userRole" class="badge bg-primary"></span></div>
    <button type="button" id="logoutBtn" class="btn btn-outline-light btn-sm w-100">Logout</button>
  </div>
</div>
      </nav>

      <main class="col-md-9 col-lg-10 p-4">
        <h1 class="h4">Dashboard</h1>
        <p class="text-muted">Main content goes here.</p>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
